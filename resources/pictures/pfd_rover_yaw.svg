<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400" viewBox="0 0 400 400" version="1.1">
    <g transform="translate(60, 60) scale(0.75)">
    <!-- Casco izquierdo -->
    <path d="M80,50 C50,100 50,300 80,350 L120,350 C150,300 150,100 120,50 Z" fill="#CC5500" stroke="#000" stroke-width="3"/>
    
    <!-- Casco derecho -->
    <path d="M320,50 C350,100 350,300 320,350 L280,350 C250,300 250,100 280,50 Z" fill="#CC5500" stroke="#000" stroke-width="3"/>
    
    <!-- Plataforma central -->
    <rect x="120" y="120" width="160" height="160" fill="#CC5500" stroke="#000" stroke-width="3"/>
    
    <!-- Estructura de soporte (triángulo de delante) -->
    <path d="M120,120 L200,50 L280,120 Z" fill="#FFD700" stroke="#000" stroke-width="3"/>
    
    <!-- Detalles adicionales -->
    <line x1="120" y1="120" x2="280" y2="280" stroke="#000" stroke-width="3"/>
    <line x1="280" y1="120" x2="120" y2="280" stroke="#000" stroke-width="3"/>
    </g>
</svg>
