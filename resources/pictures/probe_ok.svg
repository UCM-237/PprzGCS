<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- fondo transparente -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="gradBody" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#0f0f0f"/>
    </linearGradient>
    <linearGradient id="gradRing" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#111"/>
    </linearGradient>
  </defs>

  <!-- aro superior -->
  <g filter="url(#shadow)">
<!--     <ellipse cx="160" cy="44" rx="84" ry="18" fill="url(#gradRing)" /> -->
    <ellipse cx="160" cy="56" rx="50" ry="12" fill="#0b0b0b" />
  </g>

  <!-- cables (curvas) -->
  <path d="M110 60 C 95 90, 100 140, 120 180" stroke="#8aa4c2" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M170 60 C 185 100, 200 150, 190 190" stroke="#6b8fae" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M210 60 C 235 95, 240 145, 230 190" stroke="#5a7994" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- anillo superior (pared) -->
<!--   <ellipse cx="160" cy="72" rx="96" ry="20" fill="url(#gradRing)" /> -->
  <ellipse cx="160" cy="72" rx="50" ry="14" fill="#0c0c0c" />

  <!-- pilares/varillas -->
  <rect x="128" y="80" width="8" height="160" rx="3" fill="#222" />
  <rect x="168" y="80" width="8" height="160" rx="3" fill="#222" />
  <rect x="100" y="86" width="6" height="150" rx="3" fill="#1c1c1c" transform="skewX(-2)"/>
  <rect x="214" y="86" width="6" height="150" rx="3" fill="#1c1c1c" transform="skewX(2)"/>

  <!-- cuerpo central (cilindro) -->
  <g transform="translate(0,0)">
    <ellipse cx="160" cy="220" rx="44" ry="12" fill="#0b0b0b" />
    <rect x="116" y="92" width="88" height="140" rx="16" fill="url(#gradBody)" />
    <ellipse cx="160" cy="92" rx="60" ry="12" fill="#0a0a0a" />
    <ellipse cx="160" cy="232" rx="44" ry="12" fill="#070707" />
  </g>

  <!-- pequeñas sondas laterales -->
  <g>
    <rect x="100" y="170" width="18" height="78" rx="9" fill="#e9eef6" />
    <rect x="202" y="170" width="18" height="78" rx="9" fill="#e9eef6" />
    <circle cx="109" cy="168" r="6" fill="#b7c8dc"/>
    <circle cx="211" cy="168" r="6" fill="#9fb3cf"/>
  </g>

  <!-- soportes horizontales -->
  <rect x="120" y="140" width="80" height="8" rx="4" fill="#111" />
  <rect x="120" y="184" width="80" height="8" rx="4" fill="#111" />

  <!-- gancho superior -->
<!--   <path d="M160 28 v-12 a10 10 0 0 1 20 0" stroke="#9aa6af" stroke-width="6" fill="none" stroke-linecap="round"/> -->

  <!-- detalles y sombras -->
  <ellipse cx="160" cy="140" rx="28" ry="6" fill="#000" opacity="0.08"/>
  <rect x="148" y="110" width="24" height="8" rx="3" fill="#111" opacity="0.9"/>

</svg>

