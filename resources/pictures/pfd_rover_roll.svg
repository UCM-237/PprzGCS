<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" version="1.1">
  <g transform="translate(45, -30) scale(0.8)">
  <!-- Trapecio amarillo central -->
  <path d="M100,320 L300,320 L260,150 L140,150 Z" fill="#FFD700" stroke="#000" stroke-width="3"/>
  
  <!-- Elipse izquierda (más ancha verticalmente, eje corto horizontal) -->
  <ellipse cx="90" cy="280" rx="30" ry="50" fill="#CC5500" stroke="#000" stroke-width="3"/>

  <!-- Elipse derecha (más ancha verticalmente, eje corto horizontal) -->
  <ellipse cx="310" cy="280" rx="30" ry="50" fill="#CC5500" stroke="#000" stroke-width="3"/>

  </g>
</svg>
