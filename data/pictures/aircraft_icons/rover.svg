<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    width="400" height="400"
    viewBox="0 0 400 400"
    version="1.1"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
>
    <!-- Casco izquierdo -->
    <path d="M80,50 C50,100 50,300 80,350 L120,350 C150,300 150,100 120,50 Z" 
          fill="#008000" stroke="#000" stroke-width="3" />
    
    <!-- Casco derecho -->
    <path d="M320,50 C350,100 350,300 320,350 L280,350 C250,300 250,100 280,50 Z" 
          fill="#008000" stroke="#000" stroke-width="3" />
    
    <!-- Plataforma central -->
    <rect x="120" y="120" width="160" height="160" fill="#00A000" stroke="#000" stroke-width="3" />
    
    <!-- Estructura de soporte -->
    <path d="M120,120 L200,50 L280,120 Z" fill="#00B000" stroke="#000" stroke-width="3" />
    <path d="M120,280 L200,350 L280,280 Z" fill="#00B000" stroke="#000" stroke-width="3" />
    
    <!-- Detalles adicionales -->
    <line x1="120" y1="120" x2="280" y2="280" stroke="#000" stroke-width="3" />
    <line x1="280" y1="120" x2="120" y2="280" stroke="#000" stroke-width="3" />
</svg>

